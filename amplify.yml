version: 1
applications:
  - frontend:
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        # Amplify Hosting detects and deploys Next.js SSR from the complete
        # .next build output. The standalone directory is only for running
        # `node server.js` on a self-managed server.
        baseDirectory: .next
        files:
          - '**/*'
      cache:
        paths:
          - .npm/**/*
          - node_modules/**/*
    appRoot: frontend
